spring.application.name=gateway
server.port=${SERVER_PORT:8084}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/payment-system}

spring.cloud.gateway.routes[0].id=authentication-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI:http://localhost:8085}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=${USER_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=${ORDER_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/orders/**

spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=${PAYMENT_SERVICE_URI:http://localhost:8086}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/payments/**

management.endpoints.web.exposure.include=health,info