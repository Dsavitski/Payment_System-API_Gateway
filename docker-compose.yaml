services:
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: postgres-keycloak
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payment-system-network

  postgres-user:
    image: postgres:16-alpine
    container_name: payment_system_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB_USER}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payment-system-network

  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB_ORDER}
      POSTGRES_USER: ${POSTGRES_USER_ORDER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_ORDER}
    ports:
      - "5434:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_ORDER} -d ${POSTGRES_DB_ORDER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payment-system-network

  redis:
    image: redis:7-alpine
    container_name: payment_system_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payment-system-network

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: paymentdb
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment-system-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - payment-system-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.2
    container_name: keycloak
    command: start-dev --import-realm
    restart: always
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8081:8080"
    volumes:
      - ../Authentication_service/keycloak/import:/opt/keycloak/data/import
    networks:
      - payment-system-network

  authentication-service:
    build:
      context: ../Authentication_service
      dockerfile: Dockerfile
    container_name: authentication-service
    restart: always
    depends_on:
      keycloak:
        condition: service_started
    environment:
      SERVER_PORT: ${AUTH_SERVER_PORT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL}
      SERVICES_USER_SERVICE_URL: ${USER_SERVICE_URI}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
    ports:
      - "8085:8085"
    networks:
      - payment-system-network

  user-service:
    build:
      context: ../User_Service/userService/demo
      dockerfile: Dockerfile
    container_name: user-service
    restart: always
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL: jdbc:postgresql://postgres-user:5432/${POSTGRES_DB_USER}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
    ports:
      - "8082:8082"
    networks:
      - payment-system-network

  order-service:
    build:
      context: ../Order_Service
      dockerfile: Dockerfile
    container_name: order-service
    restart: always
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL: jdbc:postgresql://postgres-order:5432/${POSTGRES_DB_ORDER}
      DB_USERNAME: ${POSTGRES_USER_ORDER}
      DB_PASSWORD: ${POSTGRES_PASSWORD_ORDER}
      USER_SERVICE_URL: ${USER_SERVICE_URI}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
      KAFKA_BOOTSTRAP_SERVERS: ${ORDER_KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${ORDER_KAFKA_CONSUMER_GROUP_ID}
      KAFKA_TOPIC_PAYMENT_CREATED: ${ORDER_KAFKA_TOPIC_PAYMENT_CREATED}
    ports:
      - "8083:8083"
    networks:
      - payment-system-network

  payment-service:
    build:
      context: ../Payment_Service
      dockerfile: Dockerfile
    container_name: payment-service
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: ${PAYMENT_SERVICE_PORT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT}
      PAYMENT_KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      PAYMENT_KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
      PAYMENT_MONGODB_URI: ${PAYMENT_MONGODB_URI}
      PAYMENT_KAFKA_BOOTSTRAP_SERVERS: ${PAYMENT_KAFKA_BOOTSTRAP_SERVERS}
      PAYMENT_KAFKA_TOPIC_PAYMENT_CREATED: ${PAYMENT_KAFKA_TOPIC_PAYMENT_CREATED}
      PAYMENT_RANDOM_API_URL: ${PAYMENT_RANDOM_API_URL}
      PAYMENT_RANDOM_API_TIMEOUT_MS: ${PAYMENT_RANDOM_API_TIMEOUT_MS}
    ports:
      - "8086:8086"
    networks:
      - payment-system-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway
    restart: always
    depends_on:
      - keycloak
      - authentication-service
      - user-service
      - order-service
      - payment-service
    environment:
      SERVER_PORT: ${GATEWAY_PORT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      AUTH_SERVICE_URI: ${AUTH_SERVICE_URI}
      USER_SERVICE_URI: ${USER_SERVICE_URI}
      ORDER_SERVICE_URI: ${ORDER_SERVICE_URI}
      PAYMENT_SERVICE_URI: ${PAYMENT_SERVICE_URI}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    networks:
      - payment-system-network

networks:
  payment-system-network:
    driver: bridge

volumes:
  postgres_keycloak_data:
  postgres_data:
  postgres_order_data:
  redis_data:
  mongodb_data: